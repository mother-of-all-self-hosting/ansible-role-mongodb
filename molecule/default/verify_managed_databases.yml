---
- name: Verify MongoDB managed databases
  hosts: all
  become: true
  gather_facts: false

  vars:
    mongodb_verify_changed_password: molecule-changed-password

  tasks:
    # A fact rather than a play variable, because the checks below override
    # `mongodb_managed_databases_additional` based on it.
    - name: Determine the managed database to verify
      ansible.builtin.set_fact:
        mongodb_verify_managed_db: "{{ mongodb_managed_databases_additional | first }}"

    - name: Include the variables the MongoDB role relies on
      ansible.builtin.include_role:
        name: com.devture.ansible.role.systemd_docker_base
        public: true

    # Preparation runs on every installation, against users which already exist,
    # so it has to succeed on an already-prepared server, leave it prepared and report no change.
    - name: Prepare the managed databases again
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
        tasks_from: util/prepare_managed_databases

    - name: Verify the managed database after preparing it again
      ansible.builtin.include_tasks: tasks/verify_managed_database.yml
      vars:
        mongodb_verify_case: preparing it again
        mongodb_verify_expected_changes: []
        mongodb_verify_password: "{{ mongodb_verify_managed_db.password }}"
        mongodb_verify_wrong_password: "{{ mongodb_verify_changed_password }}"

    # Passwords are only set when they differ from the stored ones, so changing one has to be noticed.
    - name: Prepare the managed databases with a changed password
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
        tasks_from: util/prepare_managed_databases
      vars:
        mongodb_managed_databases_additional:
          - "{{ mongodb_verify_managed_db | combine({'password': mongodb_verify_changed_password}) }}"

    - name: Verify the managed database after preparing it with a changed password
      ansible.builtin.include_tasks: tasks/verify_managed_database.yml
      vars:
        mongodb_verify_case: preparing it with a changed password
        mongodb_verify_expected_changes:
          - "set the password of user `{{ mongodb_verify_managed_db.username }}` in database `{{ mongodb_verify_managed_db.name }}`"
        mongodb_verify_password: "{{ mongodb_verify_changed_password }}"
        mongodb_verify_wrong_password: "{{ mongodb_verify_managed_db.password }}"

    - name: Prepare the managed databases with the original password
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
        tasks_from: util/prepare_managed_databases

    - name: Verify the managed database after preparing it with the original password
      ansible.builtin.include_tasks: tasks/verify_managed_database.yml
      vars:
        mongodb_verify_case: preparing it with the original password
        mongodb_verify_expected_changes:
          - "set the password of user `{{ mongodb_verify_managed_db.username }}` in database `{{ mongodb_verify_managed_db.name }}`"
        mongodb_verify_password: "{{ mongodb_verify_managed_db.password }}"
        mongodb_verify_wrong_password: "{{ mongodb_verify_changed_password }}"
