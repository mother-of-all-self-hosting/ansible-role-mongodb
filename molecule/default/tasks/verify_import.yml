---
# The document that verify.yml stored in the `molecule` database has to come back from the dump.
# The import stops at the first document it cannot restore, so every database the dump holds is dropped first
# (not just `molecule`), as the documents still there would fail with duplicate keys.
- name: Drop the databases the dump holds ({{ mongodb_verify_dump }})
  ansible.builtin.command:
    cmd: >-
      docker exec mongodb mongosh --quiet
      -u root -p {{ mongodb_root_password }} --authenticationDatabase admin
      --eval 'db.adminCommand({listDatabases: 1, nameOnly: true}).databases.map((d) => d.name).filter((name) => !["admin", "config", "local"].includes(name)).every((name) => db.getSiblingDB(name).dropDatabase().ok === 1)'
  register: mongodb_verify_drop
  changed_when: true
  failed_when: (mongodb_verify_drop.stdout | trim) != 'true'

- name: Import the dump ({{ mongodb_verify_dump }})
  ansible.builtin.include_role:
    name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
    tasks_from: import
  vars:
    mongodb_server_path_dump: "{{ mongodb_verify_dump }}"

- name: Read the document back ({{ mongodb_verify_dump }})
  ansible.builtin.command:
    cmd: >-
      docker exec mongodb mongosh --quiet
      -u root -p {{ mongodb_root_password }} --authenticationDatabase admin
      --eval 'db.getSiblingDB("molecule").probe.findOne({_id: "molecule-probe"}).value'
  register: mongodb_verify_imported
  changed_when: false
  failed_when: false

- name: Assert the dump was imported ({{ mongodb_verify_dump }})
  ansible.builtin.assert:
    that: (mongodb_verify_imported.stdout | trim) == 'molecule-value'
    fail_msg: "Importing {{ mongodb_verify_dump }} did not bring the document back: {{ mongodb_verify_imported.stdout }}{{ mongodb_verify_imported.stderr }}"
    success_msg: "Importing {{ mongodb_verify_dump }} brought the document back"
