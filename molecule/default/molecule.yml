---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: mongodb-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        mongodb_debug_service_enabled: false

        # Variables for MongoDB
        mongodb_uid: 1000
        mongodb_gid: 1000

        # Verification asserts that unauthenticated clients are turned away,
        # which only tests anything when a password is actually configured.
        mongodb_root_password: molecule-root-password

        # `mongodb_managed_databases` is deliberately left empty here.
        # Preparing a managed database re-templates, re-runs and re-deletes the
        # initialization script on every run, so configuring one would make the
        # role report itself as changed forever and fail the idempotence stage
        # for reasons that have nothing to do with the change under test.
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
