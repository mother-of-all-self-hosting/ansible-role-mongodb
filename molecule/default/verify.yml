---
- name: Verify MongoDB systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for MongoDB service to become active (up to 180s)
      ansible.builtin.systemd:
        name: mongodb.service
      register: mongodb_service
      until: mongodb_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert MongoDB service is active
      ansible.builtin.assert:
        that: mongodb_service.status.ActiveState == 'active'
        fail_msg: "mongodb.service not active ({{ mongodb_service.status.ActiveState }})"
        success_msg: "mongodb.service is active"

    - name: Retrieve MongoDB service log for debugging
      when: mongodb_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu mongodb.service
      changed_when: false

    - name: Show MongoDB systemd service status summary
      ansible.builtin.debug:
        msg:
          - "MongoDB systemd: {{ mongodb_service.status.ActiveState }}"
