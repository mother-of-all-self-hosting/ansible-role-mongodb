---
name: molecule

on:  # yamllint disable-line rule:truthy
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  molecule:
    name: Run Molecule scenario '${{ matrix.scenario }}' on ${{ matrix.distro }}
    runs-on: ubuntu-26.04

    # Same-repository pull requests already run via the push event;
    # run pull_request jobs only for pull requests from forks.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository

    strategy:
      matrix:
        distro:
          - ubuntu2604
        scenario:
          - default
          - upgrade
      fail-fast: false

    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          path: mongodb

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version-file: mongodb/.python-version
          cache: pip
          cache-dependency-path: mongodb/molecule/requirements.txt

      - name: Install Python dependencies
        working-directory: mongodb
        run: pip install -r molecule/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('mongodb/molecule/*/requirements.yml') }}

      # The runner ships AppArmor profiles for individual programs (wg-quick, mosquitto, ...),
      # which attach by path.
      # Docker inside the Molecule instance cannot confine its containers with AppArmor,
      # so those profiles end up applying to the programs inside the containers under test and break them.
      # On a real host, Docker's own profile confines the containers,
      # so the host's per-program profiles do not attach.
      - name: Unload the runner's AppArmor profiles
        run: sudo aa-teardown

      # The upgrade scenario seeds the release before the pinned one (8.3 for 9.0),
      # and MongoDB releases before 9.0 refuse to start on the runner's kernel
      # (https://jira.mongodb.org/browse/SERVER-121912).
      # Skip the scenario while 9.0 is pinned.
      # Once a later release is pinned, its seed (9.0 or later) can start,
      # so this step fails as a reminder to remove it.
      - name: Skip the upgrade scenario while its seed cannot start
        id: upgrade_guard
        if: matrix.scenario == 'upgrade'
        working-directory: mongodb
        run: |
          version="$(sed -n 's/^mongodb_version: *//p' defaults/main.yml)"
          case "$version" in
            9.0.*)
              echo "::notice::Skipping the upgrade scenario: its seed release cannot start on the runner's kernel (SERVER-121912)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::mongodb_version is now ${version}, so the upgrade scenario's seed can start again. Remove this step from .github/workflows/molecule.yml to re-enable the scenario."
              exit 1
              ;;
          esac

      - name: Run Molecule
        if: steps.upgrade_guard.outputs.skip != 'true'
        working-directory: mongodb
        run: molecule test --scenario-name ${{ matrix.scenario }}
